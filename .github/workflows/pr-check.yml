# 모든 PR의 형식·비밀값을 검사한다. 세 레포 공통 부분은 같게 유지한다.
# 실패(❌)해도 GitHub Free·브랜치 보호 없이 운영하므로 머지가 자동으로 막히지 않는다.
# ❌인 PR은 머지하지 않는다 (CONTRIBUTING 5장). error = 차단 기준, warning = 리뷰 때 확인.
name: pr-check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
  issues: read       # 릴리스 PR: 커밋이 가리키는 이슈가 열려 있는지 확인 (D-49)
jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 형식 검사
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          FREEZE: ${{ vars.FEATURE_FREEZE }}
        run: |
          fail=0
          # 이슈 닫는 키워드 (D-49). 기본 브랜치가 main이라 main에 들어가는 제목·본문·커밋의 키워드는 이슈를 닫는다.
          close_re='(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'
          # PR 제목 = Squash 커밋 제목이므로 제목에는 닫는 키워드를 쓰지 않는다
          if printf '%s' "$TITLE" | grep -Eiq "$close_re"; then
            echo "::error::PR 제목에 이슈 닫는 키워드(Closes·Fixes·Resolves #번호)를 쓰지 않습니다. 본문에 적어 주세요 (D-49)."; fail=1
          fi

          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ]; then
              echo "::error::main에는 develop만 머지합니다 (릴리스 PR). 팀원 PR의 대상은 develop입니다 (gh pr create --base develop)."; exit 1
            fi
            if printf '%s' "$BODY" | grep -Eiq "$close_re"; then
              echo "::error::릴리스 PR 본문에는 이슈 닫는 키워드를 쓰지 않습니다. 관련 이슈는 'Refs #번호' 또는 링크로 적어 주세요 (D-49)."; fail=1
            fi
            echo "릴리스 PR: 나머지 형식 검사 생략"; exit $fail
          fi

          branch_re='^(feature|fix|docs|chore)/#[0-9]+-[a-z0-9-]+$'
          if ! [[ "$HEAD" =~ $branch_re ]]; then
            echo "::error::브랜치 이름은 feature|fix|docs|chore/#이슈번호-영문-이름 형식이어야 합니다. 현재: $HEAD"; fail=1
          fi

          title_re='^\[#[0-9]+\] .+'
          if ! [[ "$TITLE" =~ $title_re ]]; then
            echo "::error::PR 제목은 [#이슈번호] 제목 형식이어야 합니다."; fail=1
          fi

          # 이슈 연결 (D-71): Closes #n = 이슈 전체를 끝내는 최종 PR, Refs #n = 일부만 끝내는 PR(이슈는 열린 채 유지).
          # 같은 레포 이슈(#12) 또는 다른 레포 이슈(OneMonthproJect/chagok-docs#12). Refs는 issue-close가 닫지 않는다.
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|\brefs?) ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'; then
            echo "::error::PR 본문에 이슈 연결이 필요합니다: 이슈 전체를 끝내는 PR은 'Closes #이슈번호'(develop 머지 + done-verified 라벨이면 issue-close가 닫음), 일부만 끝내는 PR은 'Refs #이슈번호'(이슈는 열린 채 유지) (D-71)."; fail=1
          fi

          if [ "$FREEZE" = "true" ] && [[ "$HEAD" == feature/* ]]; then
            echo "::error::M4 기능 동결 중입니다. feature/ 브랜치 PR은 머지하지 않습니다 (fix/·docs/만 가능)."; fail=1
          fi
          exit $fail

      - name: 릴리스 커밋의 이슈 닫는 키워드 검사 (차단, D-49)
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 릴리스 머지 때 커밋 메시지의 닫는 키워드가 이슈를 닫는다. done-verified 없이 열어 둔 이슈가
          # 의도치 않게 닫히지 않도록, 열린 이슈를 가리키는 키워드가 있으면 실패시킨다(이미 닫힌 이슈는 영향 없음).
          close_re='(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'
          refs=$(git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -oiE "$close_re" \
            | grep -oE '([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+$' | sort -u || true)
          fail=0
          for t in $refs; do
            r=${t%#*}; n=${t##*#}; repo=${r:-$REPO}
            if ! st=$(gh api "repos/$repo/issues/$n" -q .state 2>/dev/null); then
              echo "::warning::$repo#$n 의 상태를 확인하지 못했습니다. 형상관리자가 직접 확인해 주세요."; continue
            fi
            if [ "$st" = "open" ]; then
              echo "::error::릴리스 커밋이 열린 이슈 $repo#$n 을(를) 닫는 키워드를 담고 있습니다. 머지하면 done-verified 확인 없이 닫힙니다. 원래 PR에 done-verified를 붙여 develop 기준으로 먼저 닫히게 하거나 형상관리자가 판단해 주세요 (D-49)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "릴리스 커밋: 열린 이슈를 닫는 키워드 없음"
          exit $fail

      - name: 비밀값·민감 파일 검사 (차단)
        if: github.base_ref != 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/secret-scan.sh "$BASE_SHA" "$HEAD_SHA"

      - name: AI 공동 작성자 표기 검사
        if: github.base_ref != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # PR 본문 + 모든 커밋 메시지·작성자. Squash merge 때 커밋 트레일러가 develop 커밋에 그대로 남기 때문에 커밋까지 본다.
          text=$(gh pr view "$PR" --repo "$REPO" --json body,commits -q '
            (.body // ""),
            (.commits[] | (.messageHeadline // ""), (.messageBody // ""),
              (.authors[]? | ((.name // "") + " <" + (.email // "") + ">")))')
          pattern='co-authored-by:.*(claude|anthropic)|noreply@anthropic\.com|generated with \[?claude'
          if printf '%s\n' "$text" | grep -Eiq "$pattern"; then
            printf '%s\n' "$text" | grep -Ein "$pattern" | head -5
            echo "::error::커밋 또는 PR 본문에 AI 공동 작성자 표기가 있습니다. 해당 줄을 지우고 다시 push해 주세요 (CONTRIBUTING 4장). 마지막 커밋이면: git commit --amend 로 메시지 수정 후 git push --force-with-lease"
            exit 1
          fi
          echo "AI 표기 없음"

      - name: 문서 동기화 검사 (chagok-docs)
        if: github.base_ref != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path')
          has() { printf '%s\n' "$files" | grep -Eq "$1"; }
          if has '^docs/(00|04|07|08)_' && ! has '^docs/13_'; then
            echo "::warning::기준 문서(00·04·07·08)가 바뀌었습니다. 기획 변경이면 13 changelog에 한 줄 남겨 주세요."
          fi
          if has '^\.claude/(rules|skills|agents)/'; then
            echo "::warning::공용 AI 설정이 바뀝니다. 머지 후 팀에 'chagok-docs pull → sync-claude.sh 다시 실행'을 공지하고 claude.ai용 .skill도 다시 배포해 주세요."
          fi
          if has '^(CONTRIBUTING|CONVENTIONS)\.md$'; then
            echo "::warning::세 레포 공통 규칙이 바뀝니다. 코드 레포의 pr-check·CODEOWNERS·.coderabbit.yaml과 어긋나지 않는지 확인해 주세요."
          fi
          exit 0
